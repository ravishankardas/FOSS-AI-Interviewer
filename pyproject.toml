[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-interviewer"
version = "0.1.0"
description = "Open source AI interviewer — STT → LLM → TTS pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ravi Shankar Das" }]

dependencies = [
    "pdfminer.six",
    "faster-whisper",
    "piper-tts",
    "silero-vad",
    "torch",
    "numpy",
    "sounddevice",
    "pyyaml",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "websockets",
    "google-genai",
    "httpx",
    "python-dotenv",
    "loguru",
    "pydantic",
]

[project.optional-dependencies]
# local LLM backend (provider: local). Needs a C/C++ toolchain to build.
local = ["llama-cpp-python"]
cuda = ["llama-cpp-python[cuda]"]
metal = ["llama-cpp-python[metal]"]

[project.scripts]
ai-interviewer = "ai_interviewer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_interviewer*", "backend*"]

[tool.setuptools.package-data]
ai_interviewer = ["data/*.json"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestCacheWarning",
]
