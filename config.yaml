llm:
  model_path: ./models/model.gguf
  n_ctx: 4096
  n_gpu_layers: 0
  temperature: 0.7

stt:
  model_size: base  # tiny | base | small | medium | large
  device: cpu       # cpu | cuda

tts:
  voice: en_US-lessac-medium
  speed: 1.0

vad:
  threshold: 0.5
  min_speech_duration_ms: 250
  silence_duration_ms: 600
  sample_rate: 16000
  chunk_size: 512

interview:
  max_questions: 10
  answer_time_limit: 120  # seconds, 0 = unlimited
  follow_up_enabled: true

server:
  host: 0.0.0.0
  port: 8000
