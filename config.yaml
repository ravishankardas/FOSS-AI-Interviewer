interview:
  answer_time_limit: 120
  follow_up_enabled: true
  max_questions: 1
  coding_enabled: true
  coding_questions: 0
  code_time_limit: 300
llm:
  model_name: gemini-2.5-flash
  model_path: models/Llama-3.2-3B-Instruct-Q4_K_M.gguf
  n_ctx: 4096
  n_gpu_layers: 0
  provider: gemini
  temperature: 0.7
server:
  host: 0.0.0.0
  port: 8000
stt:
  provider: groq
  model_name: whisper-large-v3
  device: cpu
  model_path: medium
tts:
  speed: 1
  # active voice — change this to any key under `voices` below, then make sure
  # its model is downloaded: python -m scripts.download_voices
  voice: en_US-amy-medium
  model_path: models/en/en_US/lessac/medium/en_US-lessac-medium.onnx
  voices:
    en_US-lessac-medium: models/en/en_US/lessac/medium/en_US-lessac-medium.onnx      # neutral (default)
    en_US-amy-medium: models/en/en_US/amy/medium/en_US-amy-medium.onnx               # US female, warm
    en_US-ryan-medium: models/en/en_US/ryan/medium/en_US-ryan-medium.onnx            # US male, professional
    en_US-hfc_female-medium: models/en/en_US/hfc_female/medium/en_US-hfc_female-medium.onnx  # US female, crisp
    en_GB-alan-medium: models/en/en_GB/alan/medium/en_GB-alan-medium.onnx            # GB male, measured
vad:
  chunk_size: 512
  min_speech_duration_ms: 250
  sample_rate: 16000
  silence_duration_ms: 2000
  threshold: 0.5
executor:
  base_url: http://localhost:2000
  python_version: 3.12.0
  cpp_version: 10.2.0
  run_timeout_ms: 3000
  compile_timeout_ms: 10000