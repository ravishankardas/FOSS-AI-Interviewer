<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1228" font-family="'SFMono-Regular', 'Consolas', 'Liberation Mono', Menlo, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#111111"/>
    </marker>
  </defs>

  <!-- canvas + frame -->
  <rect x="0" y="0" width="780" height="1228" fill="#ffffff"/>
  <rect x="6" y="6" width="768" height="1216" fill="none" stroke="#111111" stroke-width="1"/>

  <!-- flow arrows -->
  <g stroke="#111111" stroke-width="1.25" fill="none" marker-end="url(#arrow)">
    <line x1="390" y1="82"   x2="390" y2="110"/>
    <line x1="390" y1="174"  x2="390" y2="202"/>
    <line x1="390" y1="258"  x2="390" y2="288"/>
    <line x1="390" y1="390"  x2="390" y2="408"/>
    <line x1="390" y1="462"  x2="390" y2="480"/>
    <line x1="390" y1="538"  x2="390" y2="556"/>
    <line x1="390" y1="616"  x2="390" y2="634"/>
    <line x1="390" y1="712"  x2="390" y2="740"/>
    <line x1="390" y1="846"  x2="390" y2="864"/>
    <line x1="390" y1="918"  x2="390" y2="936"/>
    <line x1="390" y1="1028" x2="390" y2="1056"/>
    <line x1="390" y1="1122" x2="390" y2="1150"/>
  </g>

  <!-- 1. resume (I/O terminator: doubled outline) -->
  <rect x="290" y="28" width="200" height="54" rx="27" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
  <rect x="294" y="32" width="192" height="46" rx="23" fill="none" stroke="#111111" stroke-width="0.6"/>
  <text x="390" y="60" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">Resume · PDF</text>

  <!-- 2. parse -->
  <rect x="170" y="110" width="440" height="64" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
  <text x="390" y="142" text-anchor="middle">
    <tspan x="390" dy="-5" font-size="13.5" fill="#111111">Parse résumé · generate the first question</tspan>
    <tspan x="390" dy="20" font-size="11.5" fill="#555555">runs in the background</tspan>
  </text>

  <!-- 3. greeting -->
  <rect x="170" y="202" width="440" height="56" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
  <text x="390" y="230" text-anchor="middle">
    <tspan x="390" dy="-5" font-size="13.5" fill="#111111">Greeting + self-intro</tspan>
    <tspan x="390" dy="18" font-size="11.5" fill="#555555">optional · candidate can cut in (barge-in)</tspan>
  </text>

  <!-- ===== coding round ===== -->
  <rect x="90" y="292" width="600" height="420" fill="none" stroke="#111111" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="112" y="317" font-size="11" letter-spacing="2" fill="#111111">CODING ROUND · ALWAYS LISTENING</text>

  <rect x="140" y="338" width="500" height="52" fill="#ffffff" stroke="#111111" stroke-width="1.1"/>
  <text x="390" y="369" text-anchor="middle" font-size="13" fill="#111111">In-browser editor · CodeMirror · live code synced to server</text>

  <rect x="140" y="410" width="500" height="52" fill="#ffffff" stroke="#111111" stroke-width="1.1"/>
  <text x="390" y="441" text-anchor="middle" font-size="13" fill="#111111">Run / Run tests -&gt; Piston sandbox</text>

  <rect x="140" y="482" width="500" height="56" fill="#ffffff" stroke="#111111" stroke-width="1.1"/>
  <text x="390" y="510" text-anchor="middle">
    <tspan x="390" dy="-5" font-size="13" fill="#111111">Interviewer listens the whole time · replies by voice</tspan>
    <tspan x="390" dy="19" font-size="11.5" fill="#555555">guarded clarify · graduated hints · debug — sees your live code</tspan>
  </text>

  <rect x="140" y="560" width="500" height="56" fill="#ffffff" stroke="#111111" stroke-width="1.1"/>
  <text x="390" y="588" text-anchor="middle">
    <tspan x="390" dy="-5" font-size="13" fill="#111111">Submit -&gt; run visible <tspan font-weight="700">+ hidden</tspan> tests</tspan>
    <tspan x="390" dy="19" font-size="11.5" fill="#555555">asks to optimise if the solution can be faster / leaner</tspan>
  </text>

  <rect x="140" y="638" width="500" height="56" fill="#ffffff" stroke="#111111" stroke-width="1.1"/>
  <text x="390" y="666" text-anchor="middle">
    <tspan x="390" dy="-5" font-size="13" fill="#111111">Spoken follow-up · graded on the dedicated coding rubric</tspan>
    <tspan x="390" dy="19" font-size="11.5" fill="#555555">correctness (tests) + how much help was needed</tspan>
  </text>

  <!-- ===== verbal round ===== -->
  <rect x="90" y="744" width="600" height="284" fill="none" stroke="#111111" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="112" y="769" font-size="11" letter-spacing="2" fill="#111111">VERBAL ROUND · ADAPTIVE · STREAMING</text>

  <rect x="140" y="790" width="500" height="56" fill="#ffffff" stroke="#111111" stroke-width="1.1"/>
  <text x="390" y="818" text-anchor="middle">
    <tspan x="390" dy="-5" font-size="13" fill="#111111">Stream the question · Piper TTS</tspan>
    <tspan x="390" dy="19" font-size="11.5" fill="#555555">LLM tokens -&gt; sentence -&gt; speak (first audio fast)</tspan>
  </text>

  <rect x="140" y="866" width="500" height="52" fill="#ffffff" stroke="#111111" stroke-width="1.1"/>
  <text x="390" y="897" text-anchor="middle" font-size="13" fill="#111111">Mic -&gt; VAD (Silero) -&gt; STT (Groq / Whisper)</text>

  <rect x="140" y="938" width="500" height="64" fill="#ffffff" stroke="#111111" stroke-width="1.1"/>
  <text x="390" y="970" text-anchor="middle">
    <tspan x="390" dy="-5" font-size="13" fill="#111111">Stream the next question, adapted to the last answer</tspan>
    <tspan x="390" dy="20" font-size="11.5" fill="#555555">struggled -&gt; easier · nailed -&gt; deeper</tspan>
  </text>

  <!-- adaptive loop arrow: next question back up to TTS (+ barge-in) -->
  <path d="M640 970 C 680 948 680 822 640 818" stroke="#111111" stroke-width="1.25" fill="none" marker-end="url(#arrow)"/>
  <text transform="rotate(-90 676 894)" x="676" y="894" text-anchor="middle" font-size="10" fill="#555555">next question · barge-in</text>

  <!-- 4. summary -->
  <rect x="170" y="1058" width="440" height="64" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
  <text x="390" y="1090" text-anchor="middle">
    <tspan x="390" dy="-5" font-size="13.5" fill="#111111">LLM summary + recommendation</tspan>
    <tspan x="390" dy="20" font-size="11.5" fill="#555555">coding + verbal combined</tspan>
  </text>

  <!-- 5. report (I/O terminator: doubled outline) -->
  <rect x="240" y="1150" width="300" height="64" rx="14" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
  <rect x="244" y="1154" width="292" height="56" rx="11" fill="none" stroke="#111111" stroke-width="0.6"/>
  <text x="390" y="1182" text-anchor="middle">
    <tspan x="390" dy="-4" font-size="14" font-weight="700" fill="#111111">Markdown report</tspan>
    <tspan x="390" dy="19" font-size="11.5" fill="#555555">with evidence quotes</tspan>
  </text>
</svg>
