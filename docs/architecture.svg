<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1174" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a7060"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b97f27"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="780" height="1174" rx="16" fill="#15110b"/>

  <!-- flow arrows (drawn first, under the nodes) -->
  <g stroke="#7a7060" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="390" y1="82"   x2="390" y2="110"/>
    <line x1="390" y1="176"  x2="390" y2="204"/>
    <line x1="390" y1="258"  x2="390" y2="292"/>
    <line x1="390" y1="394"  x2="390" y2="412"/>
    <line x1="390" y1="466"  x2="390" y2="484"/>
    <line x1="390" y1="538"  x2="390" y2="556"/>
    <line x1="390" y1="632"  x2="390" y2="668"/>
    <line x1="390" y1="770"  x2="390" y2="788"/>
    <line x1="390" y1="842"  x2="390" y2="860"/>
    <line x1="390" y1="948"  x2="390" y2="984"/>
    <line x1="390" y1="1052" x2="390" y2="1080"/>
  </g>

  <!-- 1. resume -->
  <rect x="290" y="28" width="200" height="54" rx="27" fill="#E8A33D"/>
  <text x="390" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#191510">Resume · PDF</text>

  <!-- 2. parse -->
  <rect x="170" y="112" width="440" height="64" rx="9" fill="#241d14" stroke="#3a3024" stroke-width="1.4"/>
  <text x="390" y="144" text-anchor="middle">
    <tspan x="390" dy="-5" font-size="14.5" fill="#ECE6DA">Parse résumé · generate the first question</tspan>
    <tspan x="390" dy="20" font-size="12" font-style="italic" fill="#9B9183">runs in the background</tspan>
  </text>

  <!-- 3. greeting -->
  <rect x="170" y="206" width="440" height="52" rx="9" fill="#241d14" stroke="#3a3024" stroke-width="1.4"/>
  <text x="390" y="237" text-anchor="middle" font-size="15" fill="#ECE6DA">Greeting + self-intro</text>

  <!-- ===== coding round ===== -->
  <rect x="90" y="296" width="600" height="336" rx="12" fill="#1b1610" stroke="#3a3024" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="112" y="321" font-size="11.5" letter-spacing="2" fill="#9B9183">CODING ROUND</text>

  <g stroke="#7a7060" stroke-width="1.6" fill="none" marker-end="url(#arrow)"></g>

  <rect x="140" y="342" width="500" height="52" rx="8" fill="#241d14" stroke="#3a3024" stroke-width="1.3"/>
  <text x="390" y="373" text-anchor="middle" font-size="14" fill="#ECE6DA">In-browser editor · CodeMirror</text>

  <rect x="140" y="414" width="500" height="52" rx="8" fill="#241d14" stroke="#3a3024" stroke-width="1.3"/>
  <text x="390" y="445" text-anchor="middle" font-size="14" fill="#ECE6DA">Run / Run tests → Piston sandbox</text>

  <rect x="140" y="486" width="500" height="52" rx="8" fill="#241d14" stroke="#3a3024" stroke-width="1.3"/>
  <text x="390" y="517" text-anchor="middle" font-size="14" fill="#ECE6DA">Submit → run visible <tspan fill="#E8A33D">+ hidden</tspan> tests</text>

  <rect x="140" y="558" width="500" height="52" rx="8" fill="#241d14" stroke="#3a3024" stroke-width="1.3"/>
  <text x="390" y="589" text-anchor="middle" font-size="13.5" fill="#ECE6DA">Grounded spoken follow-up · graded on code + tests</text>

  <!-- ===== verbal round ===== -->
  <rect x="90" y="672" width="600" height="276" rx="12" fill="#1b1610" stroke="#3a3024" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="112" y="697" font-size="11.5" letter-spacing="2" fill="#9B9183">VERBAL ROUND · ADAPTIVE</text>

  <rect x="140" y="718" width="500" height="52" rx="8" fill="#241d14" stroke="#3a3024" stroke-width="1.3"/>
  <text x="390" y="749" text-anchor="middle" font-size="14" fill="#ECE6DA">TTS speaks the question · Piper</text>

  <rect x="140" y="790" width="500" height="52" rx="8" fill="#241d14" stroke="#3a3024" stroke-width="1.3"/>
  <text x="390" y="821" text-anchor="middle" font-size="14" fill="#ECE6DA">Mic → VAD (Silero) → STT (Groq / Whisper)</text>

  <rect x="140" y="862" width="500" height="64" rx="8" fill="#241d14" stroke="#3a3024" stroke-width="1.3"/>
  <text x="390" y="894" text-anchor="middle">
    <tspan x="390" dy="-5" font-size="14" fill="#ECE6DA">One LLM call — rate the answer, pick the next</tspan>
    <tspan x="390" dy="20" font-size="12.5" fill="#9B9183">struggled → easier · nailed → deeper</tspan>
  </text>

  <!-- adaptive loop arrow: rate/pick back up to TTS -->
  <path d="M640 894 C 680 878 680 760 640 744" stroke="#b97f27" stroke-width="1.6" fill="none" marker-end="url(#arrowAmber)"/>
  <text transform="rotate(-90 676 819)" x="676" y="819" text-anchor="middle" font-size="10" fill="#9B9183">next question</text>

  <!-- 4. summary -->
  <rect x="170" y="988" width="440" height="64" rx="9" fill="#241d14" stroke="#3a3024" stroke-width="1.4"/>
  <text x="390" y="1020" text-anchor="middle">
    <tspan x="390" dy="-5" font-size="14.5" fill="#ECE6DA">LLM summary + recommendation</tspan>
    <tspan x="390" dy="20" font-size="12" fill="#9B9183">coding + verbal combined</tspan>
  </text>

  <!-- 5. report -->
  <rect x="240" y="1082" width="300" height="64" rx="32" fill="#E8A33D"/>
  <text x="390" y="1114" text-anchor="middle">
    <tspan x="390" dy="-4" font-size="15" font-weight="700" fill="#191510">Markdown report</tspan>
    <tspan x="390" dy="19" font-size="12" fill="#3a2a12">with evidence quotes</tspan>
  </text>
</svg>
