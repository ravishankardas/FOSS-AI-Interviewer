<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1174" font-family="'SFMono-Regular', 'Consolas', 'Liberation Mono', Menlo, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#111111"/>
    </marker>
  </defs>

  <!-- canvas + frame -->
  <rect x="0" y="0" width="780" height="1174" fill="#ffffff"/>
  <rect x="6" y="6" width="768" height="1162" fill="none" stroke="#111111" stroke-width="1"/>

  <!-- flow arrows -->
  <g stroke="#111111" stroke-width="1.25" fill="none" marker-end="url(#arrow)">
    <line x1="390" y1="82"   x2="390" y2="110"/>
    <line x1="390" y1="176"  x2="390" y2="204"/>
    <line x1="390" y1="258"  x2="390" y2="292"/>
    <line x1="390" y1="394"  x2="390" y2="412"/>
    <line x1="390" y1="466"  x2="390" y2="484"/>
    <line x1="390" y1="538"  x2="390" y2="556"/>
    <line x1="390" y1="632"  x2="390" y2="668"/>
    <line x1="390" y1="770"  x2="390" y2="788"/>
    <line x1="390" y1="842"  x2="390" y2="860"/>
    <line x1="390" y1="948"  x2="390" y2="984"/>
    <line x1="390" y1="1052" x2="390" y2="1080"/>
  </g>

  <!-- 1. resume (I/O terminator: doubled outline) -->
  <rect x="290" y="28" width="200" height="54" rx="27" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
  <rect x="294" y="32" width="192" height="46" rx="23" fill="none" stroke="#111111" stroke-width="0.6"/>
  <text x="390" y="60" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">Resume · PDF</text>

  <!-- 2. parse -->
  <rect x="170" y="112" width="440" height="64" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
  <text x="390" y="144" text-anchor="middle">
    <tspan x="390" dy="-5" font-size="13.5" fill="#111111">Parse résumé · generate the first question</tspan>
    <tspan x="390" dy="20" font-size="11.5" fill="#555555">runs in the background</tspan>
  </text>

  <!-- 3. greeting -->
  <rect x="170" y="206" width="440" height="52" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
  <text x="390" y="237" text-anchor="middle" font-size="13.5" fill="#111111">Greeting + self-intro</text>

  <!-- ===== coding round ===== -->
  <rect x="90" y="296" width="600" height="336" fill="none" stroke="#111111" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="112" y="321" font-size="11" letter-spacing="2" fill="#111111">CODING ROUND</text>

  <rect x="140" y="342" width="500" height="52" fill="#ffffff" stroke="#111111" stroke-width="1.1"/>
  <text x="390" y="373" text-anchor="middle" font-size="13" fill="#111111">In-browser editor · CodeMirror</text>

  <rect x="140" y="414" width="500" height="52" fill="#ffffff" stroke="#111111" stroke-width="1.1"/>
  <text x="390" y="445" text-anchor="middle" font-size="13" fill="#111111">Run / Run tests -&gt; Piston sandbox</text>

  <rect x="140" y="486" width="500" height="52" fill="#ffffff" stroke="#111111" stroke-width="1.1"/>
  <text x="390" y="517" text-anchor="middle" font-size="13" fill="#111111">Submit -&gt; run visible <tspan font-weight="700">+ hidden</tspan> tests</text>

  <rect x="140" y="558" width="500" height="52" fill="#ffffff" stroke="#111111" stroke-width="1.1"/>
  <text x="390" y="589" text-anchor="middle" font-size="12.5" fill="#111111">Grounded spoken follow-up · graded on code + tests</text>

  <!-- ===== verbal round ===== -->
  <rect x="90" y="672" width="600" height="276" fill="none" stroke="#111111" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="112" y="697" font-size="11" letter-spacing="2" fill="#111111">VERBAL ROUND · ADAPTIVE</text>

  <rect x="140" y="718" width="500" height="52" fill="#ffffff" stroke="#111111" stroke-width="1.1"/>
  <text x="390" y="749" text-anchor="middle" font-size="13" fill="#111111">TTS speaks the question · Piper</text>

  <rect x="140" y="790" width="500" height="52" fill="#ffffff" stroke="#111111" stroke-width="1.1"/>
  <text x="390" y="821" text-anchor="middle" font-size="13" fill="#111111">Mic -&gt; VAD (Silero) -&gt; STT (Groq / Whisper)</text>

  <rect x="140" y="862" width="500" height="64" fill="#ffffff" stroke="#111111" stroke-width="1.1"/>
  <text x="390" y="894" text-anchor="middle">
    <tspan x="390" dy="-5" font-size="13" fill="#111111">One LLM call: rate the answer, pick the next</tspan>
    <tspan x="390" dy="20" font-size="11.5" fill="#555555">struggled -&gt; easier · nailed -&gt; deeper</tspan>
  </text>

  <!-- adaptive loop arrow: rate/pick back up to TTS -->
  <path d="M640 894 C 680 878 680 760 640 744" stroke="#111111" stroke-width="1.25" fill="none" marker-end="url(#arrow)"/>
  <text transform="rotate(-90 676 819)" x="676" y="819" text-anchor="middle" font-size="10" fill="#555555">next question</text>

  <!-- 4. summary -->
  <rect x="170" y="988" width="440" height="64" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
  <text x="390" y="1020" text-anchor="middle">
    <tspan x="390" dy="-5" font-size="13.5" fill="#111111">LLM summary + recommendation</tspan>
    <tspan x="390" dy="20" font-size="11.5" fill="#555555">coding + verbal combined</tspan>
  </text>

  <!-- 5. report (I/O terminator: doubled outline) -->
  <rect x="240" y="1082" width="300" height="64" rx="14" fill="#ffffff" stroke="#111111" stroke-width="1.25"/>
  <rect x="244" y="1086" width="292" height="56" rx="11" fill="none" stroke="#111111" stroke-width="0.6"/>
  <text x="390" y="1114" text-anchor="middle">
    <tspan x="390" dy="-4" font-size="14" font-weight="700" fill="#111111">Markdown report</tspan>
    <tspan x="390" dy="19" font-size="11.5" fill="#555555">with evidence quotes</tspan>
  </text>
</svg>
